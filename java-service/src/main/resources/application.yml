server:
  port: ${SERVER_PORT:8080}

risk:
  api:
    base-url: ${RISK_API_BASE_URL:http://localhost:8000}
    connect-timeout: ${RISK_API_CONNECT_TIMEOUT:5s}
    read-timeout: ${RISK_API_READ_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
